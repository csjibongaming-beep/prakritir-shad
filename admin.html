<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>প্রকৃতির স্বাদ - Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;color:#222}
header{background:#176b3a;color:white;padding:18px;text-align:center}
header h1{margin:0;font-size:24px}
.container{max-width:1000px;margin:auto;padding:20px}
.card{background:white;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
input,textarea,button{width:100%;padding:12px;margin:7px 0;border-radius:7px;border:1px solid #ccc;font-size:15px}
textarea{min-height:90px;resize:vertical}
button{border:none;background:#176b3a;color:white;cursor:pointer;font-weight:bold}
.danger{background:#c62828}
.secondary{background:#555}
.hidden{display:none}
.product,.order{border:1px solid #ddd;padding:15px;border-radius:10px;margin-bottom:12px;background:#fafafa}
.product img{width:100px;height:100px;object-fit:cover;border-radius:8px;display:block;margin-bottom:10px}
.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.topbar button{width:auto;padding:10px 18px}
.status{padding:10px;border-radius:7px;margin-top:10px;background:#eef5ef}
</style>
</head>

<body>

<header>
<h1>🌿 প্রকৃতির স্বাদ — Admin Panel</h1>
</header>

<div class="container">

<div id="loginBox" class="card">
<h2>Admin Login</h2>

<input type="email" id="email" placeholder="Admin Email">
<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<div id="loginStatus" class="status"></div>
</div>

<div id="adminPanel" class="hidden">

<div class="card">
<div class="topbar">
<h2>Dashboard</h2>
<button class="secondary" onclick="logout()">Logout</button>
</div>
<div id="dashboardStatus" class="status">
Admin Panel চালু হয়েছে।
</div>
</div>

<div class="card">
<h2>নতুন Product যোগ করুন</h2>

<input type="text" id="productName" placeholder="Product Name">
<input type="number" id="productPrice" placeholder="Price">
<input type="text" id="productImage" placeholder="Image URL">

<textarea id="productDescription" placeholder="Product Description"></textarea>

<input type="number" id="productStock" placeholder="Stock" value="0">

<button onclick="addProduct()">Product Add করুন</button>
</div>

<div class="card">
<h2>Products</h2>
<button onclick="loadProducts()">🔄 Products Refresh</button>
<div id="productsList"></div>
</div>

<div class="card">
<h2>Orders</h2>
<button onclick="loadOrders()">🔄 Orders Refresh</button>
<div id="ordersList"></div>
</div>

</div>
</div>

<script>

const SUPABASE_URL =
"https://zerdbrktvcklzizopfsd.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_VMRbGWXZj1BdFYrflBg9dg_sqGdkn-S";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);

async function login(){

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const status=document.getElementById("loginStatus");

if(!email || !password){
status.textContent="Email এবং Password দিন।";
return;
}

status.textContent="Login হচ্ছে...";

const {error}=await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});

if(error){
status.textContent="Login failed: "+error.message;
return;
}

status.textContent="";
showAdmin();
}

async function logout(){

await supabaseClient.auth.signOut();

document.getElementById("adminPanel").classList.add("hidden");
document.getElementById("loginBox").classList.remove("hidden");
}

async function showAdmin(){

document.getElementById("loginBox").classList.add("hidden");
document.getElementById("adminPanel").classList.remove("hidden");

await loadProducts();
await loadOrders();
}

async function checkSession(){

const {data:{session}} =
await supabaseClient.auth.getSession();

if(session) showAdmin();
}

async function addProduct(){

const name=document.getElementById("productName").value.trim();
const price=Number(document.getElementById("productPrice").value);
const image_url=document.getElementById("productImage").value.trim();
const description=document.getElementById("productDescription").value.trim();
const stock=Number(document.getElementById("productStock").value);

if(!name || !price){
alert("Product name এবং price দিন।");
return;
}

const {error}=await supabaseClient
.from("products")
.insert([{
name,
price,
image_url,
description,
stock,
is_active:true
}]);

if(error){
alert("Product যোগ করা যায়নি:\n"+error.message);
return;
}

alert("✅ Product সফলভাবে যোগ হয়েছে!");

document.getElementById("productName").value="";
document.getElementById("productPrice").value="";
document.getElementById("productImage").value="";
document.getElementById("productDescription").value="";
document.getElementById("productStock").value="0";

loadProducts();
}

async function loadProducts(){

const list=document.getElementById("productsList");
list.innerHTML="Loading...";

const {data,error}=await supabaseClient
.from("products")
.select("*")
.order("id",{ascending:false});

if(error){
list.innerHTML="Products load failed: "+error.message;
return;
}

if(!data || data.length===0){
list.innerHTML="<p>কোনো product নেই।</p>";
return;
}

list.innerHTML="";

data.forEach(product=>{

const div=document.createElement("div");
div.className="product";

div.innerHTML=`
${product.image_url ? `<img src="${product.image_url}" alt="">` : ""}
<strong>${escapeHtml(product.name || "")}</strong>
<p>Price: ৳${product.price ?? 0}</p>
<p>Stock: ${product.stock ?? 0}</p>
<p>Status: ${product.is_active ? "Active" : "Inactive"}</p>

<button onclick="toggleProduct(${product.id},${product.is_active})">
${product.is_active ? "Product Hide করুন" : "Product Active করুন"}
</button>

<button class="danger" onclick="deleteProduct(${product.id})">
Delete
</button>
`;

list.appendChild(div);
});
}

async function toggleProduct(id,currentStatus){

const {error}=await supabaseClient
.from("products")
.update({is_active:!currentStatus})
.eq("id",id);

if(error){
alert("Update failed:\n"+error.message);
return;
}

loadProducts();
}

async function deleteProduct(id){

if(!confirm("এই product টি Delete করতে চান?")) return;

const {error}=await supabaseClient
.from("products")
.delete()
.eq("id",id);

if(error){
alert("Delete failed:\n"+error.message);
return;
}

loadProducts();
}

async function loadOrders(){

const list=document.getElementById("ordersList");
list.innerHTML="Loading orders...";

const {data,error}=await supabaseClient
.from("orders")
.select("*")
.order("id",{ascending:false});

if(error){
list.innerHTML="Orders load failed: "+error.message;
return;
}

if(!data || data.length===0){
list.innerHTML="<p>এখনো কোনো order নেই।</p>";
return;
}

list.innerHTML="";

data.forEach(order=>{

const div=document.createElement("div");
div.className="order";

div.innerHTML=`
<strong>Order #${order.id}</strong>
<p>Customer: ${escapeHtml(order.customer_name || "")}</p>
<p>Phone: ${escapeHtml(order.phone || "")}</p>
<p>Address: ${escapeHtml(order.address || "")}</p>
<p>Total: ৳${order.total_amount ?? 0}</p>
<p>Status: ${escapeHtml(order.status || "")}</p>
`;

list.appendChild(div);
});
}

function escapeHtml(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

checkSession();

</script>

</body>
</html>
